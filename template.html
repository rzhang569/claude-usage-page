<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Claude Usage</title>
<style>
  :root {
    --ground: #f0ebe1;
    --card: #faf8f3;
    --tile: #ebe4d6;
    --line: #ddd3c1;
    --ink: #262019;
    --muted: #776b5d;
    --accent: #d97757;
    --h0: #e4dccd;
    --h1: #efb08e;
    --h2: #e58a5f;
    --h3: #cc6338;
    --h4: #a3431f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; letter-spacing: -0.01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .seg { display: inline-flex; gap: 2px; background: var(--tile); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500;
    padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(90,45,20,.14); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--tile); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 18px; font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums; }
  .meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .meta .tile .v { font-size: 15px; }
  .heat { margin-top: 16px; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: 1fr; gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: var(--h0); }
  .cell.out { background: transparent; }
  .cell.l1 { background: var(--h1); } .cell.l2 { background: var(--h2); }
  .cell.l3 { background: var(--h3); } .cell.l4 { background: var(--h4); }
  .legend { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend .cell { width: 11px; height: 11px; aspect-ratio: auto; border-radius: 3px; }
  .split { color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .fun { color: var(--muted); margin-top: 6px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .chart { margin-top: 4px; overflow-x: auto; }
  .chart svg { display: block; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  .keys span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    background: var(--c); margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .tablewrap { overflow-x: auto; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: #faf8f3;
    font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .meta { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<main>
  <h1>Claude Code usage</h1>
  <div class="card">
    <div class="bar">
      <div class="seg" id="tabs">
        <button data-tab="overview">Overview</button>
        <button data-tab="models">Models</button>
      </div>
      <div class="seg" id="ranges">
        <button data-range="all">All</button>
        <button data-range="30">30d</button>
        <button data-range="7">7d</button>
      </div>
    </div>

    <section id="overview">
      <div class="tiles" id="tiles"></div>
      <div class="meta" id="meta"></div>
      <div class="heat"><div class="heat-grid" id="heat"></div></div>
      <div class="legend">Less <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> More</div>
      <div class="split" id="split"></div>
      <div class="fun" id="fun"></div>
    </section>

    <section id="models" hidden>
      <div class="keys" id="keys"></div>
      <div class="chart" id="chart"></div>
      <div class="tablewrap"><table id="mtable"></table></div>
    </section>

    <div class="foot" id="foot"></div>
  </div>
</main>
<div id="tip" hidden></div>
<script>
const DATA = /*__DATA__*/null;

const BOOKS = [
  ["The Great Gatsby", 62000],
  ["Nineteen Eighty-Four", 123000],
  ["Pride and Prejudice", 160000],
  ["Harry Potter and the Philosopher's Stone", 103000],
];
const PALETTE = ["#d97757", "#7a3a1e", "#e3b05a", "#8a6d3b", "#5f86c9", "#a86fc4", "#6b8a3a", "#9a8f7a"];

const pick = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let tab = pick("cu.tab", "overview");
let range = pick("cu.range", "all");

const fmt = n => {
  const units = [[1e9, "b"], [1e6, "m"], [1e3, "k"]];
  for (const [u, s] of units) if (n >= u) return (n / u).toFixed(1) + s;
  return String(Math.round(n));
};
const group = n => n.toLocaleString("en-US");
const sum = a => a.reduce((x, y) => x + y, 0);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function modelName(id) {
  const m = /^claude-([a-z]+)((?:-\d{1,2})+)/.exec(id);
  if (!m) return id;
  const fam = m[1][0].toUpperCase() + m[1].slice(1);
  return fam + " " + m[2].slice(1).split("-").join(".");
}

function duration(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + m + "m";
}

function hourLabel(h) {
  const suffix = h < 12 ? "AM" : "PM";
  return (h % 12 || 12) + " " + suffix;
}

const today = parse(DATA.today);
const allDates = Object.keys(DATA.days).sort();
const firstDay = allDates.length ? parse(allDates[0]) : today;

function window_() {
  const start = range === "all" ? firstDay : addDays(today, -(Number(range) - 1));
  return { start, startKey: iso(start), endKey: iso(today) };
}

// Each model's all-time mix of input / output / cache write / cache read, used to
// split days whose history only kept a per-model total.
const RATIO = Object.fromEntries(Object.entries(DATA.models).map(([m, c]) => {
  const t = sum(c) || 1; return [m, c.map(v => v / t)];
}));
// One color per model for every range, ranked by all-time tokens.
const COLOR = {};
Object.entries(DATA.models).map(([m, c]) => [modelName(m), sum(c)])
  .sort((a, b) => b[1] - a[1])
  .forEach(([n], i) => { if (!(n in COLOR)) COLOR[n] = PALETTE[Object.keys(COLOR).length % PALETTE.length]; });

function splitOf(m, v) {
  const r = RATIO[m] || [0, 0, 0, 1];
  return r.map(x => x * v);
}

function compute() {
  const w = window_();
  const keys = allDates.filter(k => k >= w.startKey && k <= w.endKey && DATA.days[k].m + sum(Object.values(DATA.days[k].tm)) > 0);
  const hours = new Array(24).fill(0), tok = [0, 0, 0, 0], models = {};
  let msgs = 0, sessions = 0, busiest = null, estimated = false;
  for (const k of keys) {
    const d = DATA.days[k];
    msgs += d.m;
    sessions += d.sc;
    (DATA.hours[k] || []).forEach((v, i) => hours[i] += v);
    for (const [m, v] of Object.entries(d.tm)) {
      const name = modelName(m);
      const acc = models[name] || (models[name] = [0, 0, 0, 0]);
      const parts = splitOf(m, v);
      parts.forEach((x, i) => acc[i] += x);
    }
    if (!busiest || d.m > DATA.days[busiest].m) busiest = k;
  }
  if (range === "all") {
    for (const name of Object.keys(models)) models[name] = [0, 0, 0, 0];
    for (const [m, c] of Object.entries(DATA.models)) {
      const name = modelName(m);
      const acc = models[name] || (models[name] = [0, 0, 0, 0]);
      c.forEach((v, i) => acc[i] += v);
    }
    msgs = DATA.totals.messages;
    sessions = DATA.totals.sessions;
  } else {
    estimated = keys.some(k => !DATA.days[k].sp);
  }
  for (const c of Object.values(models)) c.forEach((v, i) => tok[i] += v);
  const total = sum(tok);
  const span = Math.round((today - w.start) / 86400000) + 1;
  const active = new Set(keys);

  let longest = 0, run = 0;
  for (let d = new Date(w.start); d <= today; d = addDays(d, 1)) {
    run = active.has(iso(d)) ? run + 1 : 0;
    longest = Math.max(longest, run);
  }
  let current = 0;
  let d = active.has(iso(today)) || range === "all" && DATA.days[iso(today)] ? today : addDays(today, -1);
  while (DATA.days[iso(d)]) { current++; d = addDays(d, -1); }

  const startSec = w.start.getTime() / 1000;
  let longestSession = range === "all" ? DATA.totals.longest : 0;
  for (const [lo, hi] of DATA.sessions) if (lo >= startSec) longestSession = Math.max(longestSession, hi - lo);

  const peak = hours.indexOf(Math.max(...hours));
  const favorite = Object.entries(models).sort((a, b) => sum(b[1]) - sum(a[1]))[0];
  return { keys, msgs, sessions, tok, total, models, span, activeDays: keys.length, estimated,
    hasHours: sum(hours) > 0, longest, current, longestSession, busiest, peak,
    favorite: favorite ? favorite[0] : "—" };
}
function tile(k, v) { return `<div class="tile"><div class="k">${k}</div><div class="v" data-tip="${v}">${v}</div></div>`; }

function drawOverview(s) {
  document.getElementById("tiles").innerHTML =
    tile("Sessions", group(s.sessions)) +
    tile("Messages", group(s.msgs)) +
    tile("Total tokens", fmt(s.total)) +
    tile("Active days", `${s.activeDays}/${s.span}`) +
    tile("Peak hour", s.hasHours ? hourLabel(s.peak) : "—") +
    tile("Favorite model", s.favorite);
  const busy = s.busiest ? parse(s.busiest).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
  document.getElementById("meta").innerHTML =
    tile("Longest streak", s.longest + (s.longest === 1 ? " day" : " days")) +
    tile("Current streak", s.current + (s.current === 1 ? " day" : " days")) +
    tile("Longest session", s.longestSession ? duration(s.longestSession) : "—") +
    tile("Most active day", busy);

  const counts = allDates.map(k => DATA.days[k].m).filter(Boolean).sort((a, b) => a - b);
  const q = p => counts.length ? counts[Math.min(counts.length - 1, Math.floor(p * counts.length))] : 0;
  const cut = [q(0.25), q(0.5), q(0.75)];
  const weeks = 26;
  const end = addDays(today, 6 - today.getDay());
  const start = addDays(end, -(weeks * 7 - 1));
  const w = window_();
  let cells = "";
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = iso(d);
    const n = DATA.days[k] ? DATA.days[k].m : 0;
    const lvl = n === 0 ? "" : n <= cut[0] ? "l1" : n <= cut[1] ? "l2" : n <= cut[2] ? "l3" : "l4";
    const out = d > today ? " out" : "";
    const dim = (k < w.startKey && n) ? ' style="opacity:.35"' : "";
    const label = d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ": " + group(n) + " messages";
    cells += `<div class="cell ${lvl}${out}" data-tip="${label}"${dim}></div>`;
  }
  document.getElementById("heat").innerHTML = cells;

  document.getElementById("split").textContent = (s.estimated ? "≈ " : "") +
    `Input ${fmt(s.tok[0])} · Output ${fmt(s.tok[1])} · Cache read ${fmt(s.tok[3])} · Cache write ${fmt(s.tok[2])}`;
  const book = BOOKS[today.getDate() % BOOKS.length];
  document.getElementById("fun").textContent = s.total
    ? `You've used ~${group(Math.round(s.total / book[1]))}× more tokens than ${book[0]}.`
    : "";
}

function drawModels(s) {
  const names = Object.keys(s.models).sort((a, b) => sum(s.models[b]) - sum(s.models[a]));
  const color = COLOR;
  document.getElementById("keys").innerHTML = names.map(n => `<span style="--c:${color[n]}">${n}</span>`).join("");

  const days = [];
  for (let d = new Date(window_().start); d <= today; d = addDays(d, 1)) days.push(iso(d));
  const perDay = days.map(k => {
    const out = {};
    const d = DATA.days[k];
    if (d) for (const [m, v] of Object.entries(d.tm)) { const n = modelName(m); out[n] = (out[n] || 0) + v; }
    return out;
  });
  const max = Math.max(1, ...perDay.map(o => sum(Object.values(o))));
  const avail = document.getElementById("chart").clientWidth || 780;
  const slot = Math.max(2, Math.min(20, Math.floor(avail / days.length)));
  const gap = slot > 6 ? 2 : 1, bw = slot - gap, H = 160;
  const W = days.length * slot;
  let bars = "";
  perDay.forEach((o, i) => {
    let y = H;
    for (const n of names) {
      const v = o[n] || 0;
      if (!v) continue;
      const h = Math.max(1, v / max * (H - 4));
      y -= h;
      bars += `<rect x="${i * slot}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${color[n]}" data-tip="${days[i]} · ${n}: ${fmt(v)}"/>`;
    }
  });
  const first = parse(days[0]).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  document.getElementById("chart").innerHTML =
    `<svg width="${W}" height="${H + 18}" role="img" aria-label="Tokens per day by model">${bars}` +
    `<line x1="0" y1="${H + 0.5}" x2="${W}" y2="${H + 0.5}" stroke="#ddd3c1"/>` +
    `<text x="0" y="${H + 14}" font-size="11" fill="#776b5d">${first}</text>` +
    `<text x="${W}" y="${H + 14}" font-size="11" fill="#776b5d" text-anchor="end">Today · peak ${fmt(max)}/day</text></svg>`;

  const total = s.total || 1;
  document.getElementById("mtable").innerHTML =
    (s.estimated ? `<caption style="caption-side:bottom;text-align:left;color:var(--muted);font-size:12px;padding-top:8px">Input / output / cache columns are estimated for days whose history only kept a per-model total.</caption>` : "") +
    `<tr><th>Model</th><th>Tokens</th><th>Share</th><th>Input</th><th>Output</th><th>Cache write</th><th>Cache read</th></tr>` +
    names.map(n => {
      const c = s.models[n];
      return `<tr><td><span class="swatch" style="background:${color[n]}"></span>${n}</td><td>${fmt(sum(c))}</td>` +
        `<td>${(sum(c) / total * 100).toFixed(1)}%</td><td>${fmt(c[0])}</td><td>${fmt(c[1])}</td><td>${fmt(c[2])}</td><td>${fmt(c[3])}</td></tr>`;
    }).join("");
}

function draw() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  document.querySelectorAll("#ranges button").forEach(b => b.setAttribute("aria-pressed", b.dataset.range === range));
  document.getElementById("overview").hidden = tab !== "overview";
  document.getElementById("models").hidden = tab !== "models";
  const s = compute();
  if (tab === "overview") drawOverview(s); else drawModels(s);
  const when = new Date(DATA.generatedAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.getElementById("foot").textContent = `Updated ${when} · from this computer's Claude Code history only`;
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; keep("cu.tab", tab); draw();
});
document.getElementById("ranges").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; range = b.dataset.range; keep("cu.range", range); draw();
});
// Our own tooltip: shows at once, unlike the browser's built-in one.
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY - tip.offsetHeight - 10;
  tip.style.left = x + "px";
  tip.style.top = (y < 4 ? e.clientY + 16 : y) + "px";
});
document.addEventListener("mouseleave", () => tip.hidden = true);
let resizing;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(draw, 150); });
draw();
</script>
</body>
</html>
