<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Claude Usage</title>
<style>
  :root {
    --ground: #f0ebe1;
    --card: #faf8f3;
    --tile: #ebe4d6;
    --line: #ddd3c1;
    --ink: #262019;
    --muted: #776b5d;
    --accent: #d97757;
    --tip: #262019;
    --h0: #e4dccd;
    --h1: #efb08e;
    --h2: #e58a5f;
    --h3: #cc6338;
    --h4: #a3431f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; letter-spacing: -0.01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .seg { display: inline-flex; gap: 2px; background: var(--tile); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500;
    padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(90,45,20,.14); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--tile); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 18px; font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums; }
  .meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .meta .tile .v { font-size: 15px; }
  .heat { margin-top: 16px; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: 1fr; gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: var(--h0); }
  .cell.out { background: transparent; }
  .cell.l1 { background: var(--h1); } .cell.l2 { background: var(--h2); }
  .cell.l3 { background: var(--h3); } .cell.l4 { background: var(--h4); }
  .legend { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend .cell { width: 11px; height: 11px; aspect-ratio: auto; border-radius: 3px; }
  .split { color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .fun { color: var(--muted); margin-top: 6px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .chart { margin-top: 4px; overflow-x: auto; }
  .chart svg { display: block; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  .keys span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    background: var(--c); margin-right: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .tablewrap { overflow-x: auto; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--tip); color: #faf8f3;
    font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: pre; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .top h1 { margin: 0; }
  .switches { display: flex; flex-wrap: wrap; gap: 8px; }
  html.blue { --ground: #fcfcfb; --card: #f0f0ef; --tile: #d9d9d8; --line: #e2e2e0; --ink: #1f1f1e; --muted: #7c7c79;
    --accent: #2566d0; --tip: #1f1f1e; --h0: #d9d9d8; --h1: #86acea; --h2: #6394e3; --h3: #407cdd; --h4: #2566d0; }
  html.dark { color-scheme: dark; --ground: #1f1b16; --card: #2a241d; --tile: #352e25; --line: #453c31; --ink: #f3ece1; --muted: #a99c8b;
    --accent: #e8875a; --tip: #4a4036; --h0: #3a3229; --h1: #6b3a22; --h2: #9c5230; --h3: #cf7347; --h4: #f0a274; }
  html.blue.dark { --ground: #1c1c1b; --card: #262625; --tile: #333332; --line: #3d3d3b; --ink: #f2f2f0; --muted: #a0a09c;
    --accent: #5a90e6; --tip: #454543; --h0: #333332; --h1: #1f4a96; --h2: #2f6bd1; --h3: #5a90e6; --h4: #8fb6f0; }
  html.profile { --ground: #171717; --card: #2b2b2b; --tile: #2b2b2b; --line: #333; --ink: #f4f4f4; --muted: #8f8f8f;
    --tip: #3a3a3a; --h0: #2f2f2f; --h1: #16356b; --h2: #1f4f9c; --h3: #3b82f6; --h4: #7cb4f7; color-scheme: dark; }
  html.profile.light { --ground: #fff; --card: #fff; --tile: #f0f0f0; --line: #e5e5e5; --ink: #171717; --muted: #6e6e6e;
    --tip: #171717; --h0: #ececec; --h1: #bcd5fb; --h2: #7cb4f7; --h3: #3b82f6; --h4: #1f4f9c; color-scheme: light; }
  #profile { padding-top: 12px; }
  .who { text-align: center; }
  .avatar { width: 112px; height: 112px; margin: 0 auto 16px; border-radius: 50%; background: #98a6a6; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 42px; }
  .who .name { font-size: 24px; font-weight: 600; }
  .who .handle { color: var(--muted); margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 32px; padding: 12px 0;
    border: 1px solid var(--line); border-radius: 16px; }
  .stat { text-align: center; padding: 2px 8px; border-left: 1px solid var(--line); min-width: 0; }
  .stat:first-child { border-left: 0; }
  .stat .v { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .act { display: flex; justify-content: space-between; align-items: center; margin: 36px 0 12px; gap: 12px; }
  .act h2 { font-size: 15px; font-weight: 500; margin: 0; }
  .modes button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 2px 6px; cursor: pointer; }
  .modes button[aria-pressed="true"] { color: var(--ink); }
  .year { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: 1fr; gap: 3px; }
  .year .cell { border-radius: 3px; }
  .months { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .months span { white-space: nowrap; overflow: visible; width: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .meta { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: repeat(2, 1fr); row-gap: 14px; }
    .stat { border-left: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title"></h1>
    <div class="switches">
      <div class="seg" id="sources">
        <button data-source="claude">Claude Code</button>
        <button data-source="codex">Codex</button>
      </div>
      <div class="seg"><button id="appearance" aria-pressed="true"></button></div>
      <div class="seg" id="themes">
        <button data-theme="orange">Orange</button>
        <button data-theme="blue">Blue</button>
      </div>
      <div class="seg" id="styles">
        <button data-style="card">Classic</button>
        <button data-style="profile">Profile</button>
      </div>
    </div>
  </div>
  <section id="profile" hidden>
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div class="name" id="pname"></div>
      <div class="handle" id="phandle"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="act">
      <h2 id="acttitle">Token activity</h2>
      <div class="modes" id="modes">
        <button data-mode="daily">Daily</button>
        <button data-mode="weekly">Weekly</button>
        <button data-mode="total">Cumulative</button>
      </div>
    </div>
    <div class="year" id="year"></div>
    <div class="months" id="months"></div>
    <div class="foot" id="pfoot"></div>
  </section>
  <div class="card" id="cardview">
    <div class="bar">
      <div class="seg" id="tabs">
        <button data-tab="overview">Overview</button>
        <button data-tab="models">Models</button>
      </div>
      <div class="seg" id="ranges">
        <button data-range="all">All</button>
        <button data-range="30">30d</button>
        <button data-range="7">7d</button>
      </div>
    </div>

    <section id="overview">
      <div class="tiles" id="tiles"></div>
      <div class="meta" id="meta"></div>
      <div class="heat"><div class="heat-grid" id="heat"></div></div>
      <div class="legend">Less <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> More</div>
      <div class="split" id="split"></div>
      <div class="fun" id="fun"></div>
    </section>

    <section id="models" hidden>
      <div class="keys" id="keys"></div>
      <div class="chart" id="chart"></div>
      <div class="tablewrap"><table id="mtable"></table></div>
    </section>

    <div class="foot" id="foot"></div>
  </div>
</main>
<div id="tip" hidden></div>
<script>
const ALL = /*__DATA__*/null;
// A tool with no history on this computer doesn't appear at all.
const SOURCES = { claude: ALL.claude || !ALL.codex ? ALL : null, codex: ALL.codex };
const TOOL = { claude: "Claude Code", codex: "Codex" };

const BOOKS = [
  ["The Little Prince", 22000],
  ["Animal Farm", 39000],
  ["The Great Gatsby", 62000],
  ["Harry Potter and the Philosopher’s Stone", 103000],
  ["The Hobbit", 123000],
  ["1984", 123000],
  ["Pride and Prejudice", 156000],
  ["Dune", 244000],
  ["Moby-Dick", 268000],
  ["A Game of Thrones", 381000],
  ["The Lord of the Rings", 576000],
  ["War and Peace", 730000],
];
const LUCK = Math.random();
const PALETTES = {
  orange: ["#d97757", "#7a3a1e", "#e3b05a", "#8a6d3b", "#5f86c9", "#a86fc4", "#6b8a3a", "#9a8f7a"],
  blue: ["#2566d0", "#6394e3", "#86acea", "#1b4a96", "#a9c4f0", "#407cdd", "#c6d8f5", "#7c7c79"],
  orangeDark: ["#e8875a", "#f2c14e", "#b5764a", "#d9c2a0", "#7da7e0", "#c08fd6", "#9bbb5e", "#a99c8b"],
  blueDark: ["#5a90e6", "#9cc0f5", "#2f6bd1", "#c6d8f5", "#3e5f9c", "#7f9fd6", "#e0e0dc", "#a0a09c"],
};
const LOOKS = { auto: "◐ Auto", light: "☀︎ Light", dark: "☾ Dark" };

const pick = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let tab = pick("cu.tab", "overview");
let range = pick("cu.range", "all");
let style = pick("cu.style", "card");
let theme = pick("cu.theme", "orange");
let appearance = pick("cu.appearance", "auto");
let mode = pick("cu.mode", "daily");
let source = new URLSearchParams(location.search).get("source") || pick("cu.source", "claude");
if (!SOURCES[source]) source = SOURCES.claude ? "claude" : "codex";
let DATA;

const systemDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => appearance === "dark" || appearance === "auto" && systemDark.matches;

const fmt = n => {
  const units = [[1e9, "B"], [1e6, "m"], [1e3, "k"]];
  for (const [u, s] of units) if (n >= u) return (n / u).toFixed(1) + s;
  return String(Math.round(n));
};
const group = n => n.toLocaleString("en-US");
const sum = a => a.reduce((x, y) => x + y, 0);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function modelName(id) {
  if (id.startsWith("gpt-")) {
    const [version, ...words] = id.slice(4).split("-");
    return ["GPT-" + version, ...words.map(w => w[0].toUpperCase() + w.slice(1))].join(" ");
  }
  const m = /^claude-([a-z]+)((?:-\d{1,2}(?!\d))+)/.exec(id);
  if (!m) return id;
  const fam = m[1][0].toUpperCase() + m[1].slice(1);
  return fam + " " + m[2].slice(1).split("-").join(".");
}

function duration(sec) {
  const mins = Math.round(sec / 60), d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
  if (!mins) return "<1m";
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + m + "m";
}

function quartiles(values) {
  const seen = values.filter(Boolean).sort((a, b) => a - b);
  return [0.25, 0.5, 0.75].map(p => seen.length ? seen[Math.floor(p * seen.length)] : 0);
}

function hourLabel(h) {
  const suffix = h < 12 ? "AM" : "PM";
  return (h % 12 || 12) + " " + suffix;
}

const origin = () => `from this computer's ${TOOL[source]} history only`;
let today, allDates, firstDay, RATIO, RANKED;

function load() {
  DATA = SOURCES[source];
  today = parse(DATA.today);
  allDates = Object.keys(DATA.days).sort();
  firstDay = allDates.length ? parse(allDates[0]) : today;
  // Each model's all-time mix of input / output / cache write / cache read, used to
  // split days whose history only kept a per-model total.
  RATIO = Object.fromEntries(Object.entries(DATA.models).map(([m, c]) => {
    const t = sum(c) || 1; return [m, c.map(v => v / t)];
  }));
  // One color per model for every range, ranked by all-time tokens.
  RANKED = [...new Set(Object.entries(DATA.models).map(([m, c]) => [modelName(m), sum(c)])
    .sort((a, b) => b[1] - a[1]).map(([n]) => n))];
}

function window_() {
  const start = range === "all" ? firstDay : addDays(today, -(Number(range) - 1));
  return { start, startKey: iso(start), endKey: iso(today) };
}

function splitOf(m, v) {
  const r = RATIO[m] || [0, 0, 0, 1];
  return r.map(x => x * v);
}

function compute() {
  const w = window_();
  const keys = allDates.filter(k => k >= w.startKey && k <= w.endKey && active(k));
  const hours = new Array(24).fill(0), tok = [0, 0, 0, 0], models = {};
  let msgs = 0, sessions = 0, busiest = null, estimated = false;
  for (const k of keys) {
    const d = DATA.days[k];
    msgs += d.m;
    sessions += d.sc;
    (DATA.hours[k] || []).forEach((v, i) => hours[i] += v);
    for (const [m, v] of Object.entries(d.tm)) {
      const name = modelName(m);
      const acc = models[name] || (models[name] = [0, 0, 0, 0]);
      const parts = splitOf(m, v);
      parts.forEach((x, i) => acc[i] += x);
    }
    if (!busiest || d.m > DATA.days[busiest].m) busiest = k;
  }
  if (range === "all") {
    for (const name of Object.keys(models)) models[name] = [0, 0, 0, 0];
    for (const [m, c] of Object.entries(DATA.models)) {
      const name = modelName(m);
      const acc = models[name] || (models[name] = [0, 0, 0, 0]);
      c.forEach((v, i) => acc[i] += v);
    }
    msgs = DATA.totals.messages;
    sessions = DATA.totals.sessions;
    estimated = !!DATA.estimated;
  } else {
    estimated = keys.some(k => !DATA.days[k].sp);
  }
  for (const c of Object.values(models)) c.forEach((v, i) => tok[i] += v);
  const total = sum(tok);
  const span = Math.round((today - w.start) / 86400000) + 1;

  const { longest, current } = streaks();
  const longestTask = Math.max(0, ...Object.entries(DATA.tasks).filter(([k]) => k >= w.startKey).map(([, v]) => v));

  const peak = hours.indexOf(Math.max(...hours));
  const favorite = Object.entries(models).sort((a, b) => sum(b[1]) - sum(a[1]))[0];
  return { keys, msgs, sessions, tok, total, models, span, activeDays: keys.length, estimated,
    hasHours: sum(hours) > 0, longest, current, longestTask, busiest, peak,
    favorite: favorite ? favorite[0] : "—" };
}
function tile(k, v) { return `<div class="tile"><div class="k">${k}</div><div class="v" data-tip="${v}">${v}</div></div>`; }

function drawOverview(s) {
  document.getElementById("tiles").innerHTML =
    tile("Sessions", group(s.sessions)) +
    tile("Messages", group(s.msgs)) +
    tile("Total tokens", fmt(s.total)) +
    tile("Active days", range === "all" ? group(s.activeDays) : `${s.activeDays}/${s.span}`) +
    tile("Peak hour", s.hasHours ? hourLabel(s.peak) : "—") +
    tile("Favorite model", s.favorite);
  const busy = s.busiest ? parse(s.busiest).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
  document.getElementById("meta").innerHTML =
    tile("Longest streak", s.longest + (s.longest === 1 ? " day" : " days")) +
    tile("Current streak", s.current + (s.current === 1 ? " day" : " days")) +
    tile("Longest task", s.longestTask ? duration(s.longestTask) : "—") +
    tile("Most active day", busy);

  const cut = quartiles(allDates.map(k => DATA.days[k].m));
  const weeks = 26;
  const end = addDays(today, 6 - today.getDay());
  const start = addDays(end, -(weeks * 7 - 1));
  const w = window_();
  let cells = "";
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = iso(d);
    const n = DATA.days[k] ? DATA.days[k].m : 0;
    const lvl = n === 0 ? "" : n <= cut[0] ? "l1" : n <= cut[1] ? "l2" : n <= cut[2] ? "l3" : "l4";
    const out = d > today ? " out" : "";
    const dim = (k < w.startKey && n) ? ' style="opacity:.35"' : "";
    const label = d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " — " + group(n);
    cells += `<div class="cell ${lvl}${out}"${out ? "" : ` data-tip="${label}"`}${dim}></div>`;
  }
  document.getElementById("heat").innerHTML = cells;

  document.getElementById("split").textContent = (s.estimated ? "≈ " : "") +
    `Input ${fmt(s.tok[0])} · Output ${fmt(s.tok[1])} · Cache read ${fmt(s.tok[3])} · Cache write ${fmt(s.tok[2])}`;
  const spent = s.tok[0] + s.tok[1];
  const books = BOOKS.filter(b => spent >= b[1]);
  const book = books[Math.floor(LUCK * books.length)];
  const times = book ? Math.floor(spent / book[1]) : 0;
  document.getElementById("fun").textContent = !book ? ""
    : times >= 2 ? `You’ve used ~${group(times)}× more tokens than ${book[0]}.`
    : `You’ve used about as many tokens as ${book[0]}.`;
}

function drawModels(s) {
  // Models under 0.05% of the range are noise: leftovers from a retry or a one-off test.
  const names = Object.keys(s.models).filter(n => sum(s.models[n]) >= s.total * 0.0005)
    .sort((a, b) => sum(s.models[b]) - sum(s.models[a]));
  const palette = PALETTES[theme + (isDark() ? "Dark" : "")];
  const color = Object.fromEntries(RANKED.map((n, i) => [n, palette[i % palette.length]]));
  document.getElementById("keys").innerHTML = names.map(n => `<span style="--c:${color[n]}">${n}</span>`).join("");

  const days = [];
  for (let d = new Date(window_().start); d <= today; d = addDays(d, 1)) days.push(iso(d));
  const perDay = days.map(k => {
    const out = {};
    const d = DATA.days[k];
    if (d) for (const [m, v] of Object.entries(d.tm)) { const n = modelName(m); out[n] = (out[n] || 0) + v; }
    return out;
  });
  const max = Math.max(1, ...perDay.map(o => sum(Object.values(o))));
  const avail = document.getElementById("chart").clientWidth || 780;
  const slot = Math.max(2, Math.min(20, Math.floor(avail / days.length)));
  const gap = slot > 6 ? 2 : 1, bw = slot - gap, H = 160;
  const W = days.length * slot;
  let bars = "";
  perDay.forEach((o, i) => {
    let y = H;
    for (const n of names) {
      const v = o[n] || 0;
      if (!v) continue;
      const h = Math.max(1, v / max * (H - 4));
      y -= h;
      bars += `<rect x="${i * slot}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${color[n]}"/>`;
    }
    const used = names.filter(n => o[n]);
    if (used.length) {
      const text = [shortDate(parse(days[i])), ...used.map(n => `${n}: ${fmt(o[n])}`)].join("&#10;");
      bars += `<rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-tip="${text}"/>`;
    }
  });
  const first = parse(days[0]).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  document.getElementById("chart").innerHTML =
    `<svg width="${W}" height="${H + 18}" role="img" aria-label="Tokens per day by model">${bars}` +
    `<line x1="0" y1="${H + 0.5}" x2="${W}" y2="${H + 0.5}" style="stroke:var(--line)"/>` +
    `<text x="0" y="${H + 14}" font-size="11" style="fill:var(--muted)">${first}</text>` +
    `<text x="${W}" y="${H + 14}" font-size="11" style="fill:var(--muted)" text-anchor="end">Today · peak ${fmt(max)}/day</text></svg>`;

  const total = s.total || 1;
  document.getElementById("mtable").innerHTML =
    (s.estimated ? `<caption style="caption-side:bottom;text-align:left;color:var(--muted);font-size:12px;padding-top:8px">Input / output / cache columns are estimated for days whose history only kept a per-model total.</caption>` : "") +
    `<tr><th>Model</th><th>Tokens</th><th>Share</th><th>Input</th><th>Output</th><th>Cache write</th><th>Cache read</th></tr>` +
    names.map(n => {
      const c = s.models[n];
      return `<tr><td><span class="swatch" style="background:${color[n]}"></span>${n}</td><td>${fmt(sum(c))}</td>` +
        `<td>${(sum(c) / total * 100).toFixed(1)}%</td><td>${fmt(c[0])}</td><td>${fmt(c[1])}</td><td>${fmt(c[2])}</td><td>${fmt(c[3])}</td></tr>`;
    }).join("");
}

const dayTokens = k => DATA.days[k] ? sum(Object.values(DATA.days[k].tm)) : 0;
const active = k => !!DATA.days[k] && DATA.days[k].m + dayTokens(k) > 0;

function streaks() {
  let longest = 0, run = 0, prev = null;
  for (const k of allDates.filter(active)) {
    run = prev && Math.round((parse(k) - prev) / 86400000) === 1 ? run + 1 : 1;
    longest = Math.max(longest, run);
    prev = parse(k);
  }
  let current = 0;
  let d = active(iso(today)) ? today : addDays(today, -1);
  while (active(iso(d))) { current++; d = addDays(d, -1); }
  return { longest, current };
}

const shortDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });

// The Classic view stays in English like the original card; Profile follows the system language.
const ZH = /^zh/i.test(navigator.language || "");
const P = ZH ? {
  total: "累计 Token 数", peak: "Token 单日峰值", task: "最长任务用时", longest: "最长连续天数", current: "当前连续天数",
  activity: "Token 活动", daily: "每天", weekly: "每周", cumulative: "累计总量",
  days: n => n + " 天", tokens: v => v + " Token",
  date: d => `${d.getMonth() + 1}月${d.getDate()}日`, month: d => `${d.getMonth() + 1}月`,
  week: s => `${s} 当周`, through: s => `截至 ${s}`,
  duration: sec => {
    const mins = Math.round(sec / 60), h = Math.floor(mins / 60);
    return mins ? (h ? h + " 小时 " : "") + mins % 60 + " 分" : "不到 1 分";
  },
  amount: n => n >= 1e8 ? (n / 1e8).toFixed(1) + "亿" : n >= 1e4 ? (n / 1e4).toFixed(1) + "万" : String(Math.round(n)),
  updated: s => `更新于 ${s} · 仅统计这台电脑的 ${TOOL[source]} 记录`,
  stamp: d => `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`,
} : {
  total: "Total tokens", peak: "Peak day", task: "Longest task", longest: "Longest streak", current: "Current streak",
  activity: "Token activity", daily: "Daily", weekly: "Weekly", cumulative: "Cumulative",
  days: n => n + (n === 1 ? " day" : " days"), tokens: v => v + " tokens",
  date: shortDate, month: d => d.toLocaleDateString("en-US", { month: "short" }),
  week: s => `Week of ${s}`, through: s => `Through ${s}`,
  duration, amount: fmt,
  updated: s => `Updated ${s} · ${origin()}`,
  stamp: d => d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }),
};

function drawProfile() {
  const name = ALL.user || "you";
  document.getElementById("acttitle").textContent = P.activity;
  for (const [m, key] of [["daily", "daily"], ["weekly", "weekly"], ["total", "cumulative"]])
    document.querySelector(`[data-mode=${m}]`).textContent = P[key];
  document.getElementById("avatar").textContent = name.slice(0, 2).toUpperCase();
  document.getElementById("pname").textContent = name;
  document.getElementById("phandle").textContent = "@" + name;
  const tokens = allDates.map(dayTokens);
  const s = streaks();
  const task = Math.max(0, ...Object.values(DATA.tasks));
  document.getElementById("stats").innerHTML = [
    [P.amount(sum(Object.values(DATA.models).map(sum))), P.total], [P.amount(Math.max(0, ...tokens)), P.peak],
    [task ? P.duration(task) : "—", P.task], [P.days(s.longest), P.longest], [P.days(s.current), P.current],
  ].map(([v, k]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

  const end = addDays(today, 6 - today.getDay());
  const start = addDays(end, -(53 * 7 - 1));
  const cells = [];
  let running = allDates.filter(k => k < iso(start)).reduce((n, k) => n + dayTokens(k), 0);
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = iso(d), n = dayTokens(k);
    running += d > today ? 0 : n;
    cells.push({ d, k, n, running, future: d > today });
  }
  const week = i => cells.slice(i - i % 7, i - i % 7 + 7);
  const value = (c, i) => mode === "daily" ? c.n : mode === "weekly" ? sum(week(i).map(x => x.n)) : c.running;
  const label = (c, i) => mode === "daily" ? `${P.date(c.d)}: ${P.tokens(P.amount(c.n))}`
    : mode === "weekly" ? `${P.week(P.date(week(i)[0].d))}: ${P.tokens(P.amount(value(c, i)))}`
    : `${P.through(P.date(c.d))}: ${P.tokens(P.amount(c.running))}`;
  const cut = quartiles(cells.map(value));
  document.getElementById("year").innerHTML = cells.map((c, i) => {
    const v = value(c, i);
    const lvl = c.future ? "out" : !v ? "" : v <= cut[0] ? "l1" : v <= cut[1] ? "l2" : v <= cut[2] ? "l3" : "l4";
    return `<div class="cell ${lvl}"${c.future ? "" : ` data-tip="${label(c, i)}"`}></div>`;
  }).join("");
  let months = "", last = -1;
  for (let w = 0; w < 53; w++) {
    const m = cells[w * 7].d.getMonth();
    months += `<span>${m !== last && w < 51 ? P.month(cells[w * 7].d) : ""}</span>`;
    last = m;
  }
  document.getElementById("months").innerHTML = months;
}

function draw() {
  const isProfile = style === "profile";
  document.getElementById("title").textContent = `${TOOL[source]} usage`;
  document.getElementById("sources").hidden = !(SOURCES.claude && SOURCES.codex);
  document.querySelectorAll("#sources button").forEach(b => b.setAttribute("aria-pressed", b.dataset.source === source));
  document.documentElement.classList.toggle("profile", isProfile);
  document.documentElement.classList.toggle("blue", theme === "blue" && !isProfile);
  document.documentElement.classList.toggle("dark", isDark() && !isProfile);
  document.getElementById("appearance").textContent = LOOKS[appearance];
  document.documentElement.classList.toggle("light", !isDark() && isProfile);
  document.getElementById("themes").hidden = isProfile;
  document.querySelectorAll("#themes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === theme));
  document.getElementById("profile").hidden = !isProfile;
  document.getElementById("cardview").hidden = isProfile;
  document.getElementById("title").hidden = isProfile;
  document.querySelector(".top").style.justifyContent = isProfile ? "flex-end" : "";
  document.querySelectorAll("#styles button").forEach(b => b.setAttribute("aria-pressed", b.dataset.style === style));
  document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  if (isProfile) {
    drawProfile();
    document.getElementById("pfoot").textContent = P.updated(P.stamp(new Date(ALL.generatedAt)));
    return;
  }
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  document.querySelectorAll("#ranges button").forEach(b => b.setAttribute("aria-pressed", b.dataset.range === range));
  document.getElementById("overview").hidden = tab !== "overview";
  document.getElementById("models").hidden = tab !== "models";
  const s = compute();
  if (tab === "overview") drawOverview(s); else drawModels(s);
  const when = new Date(ALL.generatedAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.getElementById("foot").textContent = `Updated ${when} · ${origin()}`;
}

[["styles", "style", v => style = v], ["sources", "source", v => { source = v; load(); history.replaceState(null, "", location.pathname); }], ["themes", "theme", v => theme = v],
 ["modes", "mode", v => mode = v], ["tabs", "tab", v => tab = v], ["ranges", "range", v => range = v]]
  .forEach(([id, key, set]) => document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    set(b.dataset[key]); keep("cu." + key, b.dataset[key]); draw();
  }));
document.getElementById("appearance").addEventListener("click", () => {
  const order = Object.keys(LOOKS);
  appearance = order[(order.indexOf(appearance) + 1) % order.length];
  keep("cu.appearance", appearance);
  draw();
});
systemDark.addEventListener("change", draw);
// Our own tooltip: shows at once, unlike the browser's built-in one.
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY - tip.offsetHeight - 10;
  tip.style.left = x + "px";
  tip.style.top = (y < 4 ? e.clientY + 16 : y) + "px";
});
document.addEventListener("mouseleave", () => tip.hidden = true);
let resizing;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(draw, 150); });
load();
draw();
</script>
</body>
</html>
